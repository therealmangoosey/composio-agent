name: Fix invite permissions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch invite URL permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '&scope=bot%20applications.commands&permissions=0'
          new = '&scope=bot%20applications.commands&permissions=84992'
          if old not in s:
              raise SystemExit('invite permission string not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          compile(p.read_text(encoding='utf-8'), 'app.py', 'exec')
          PY
      - name: Remove temporary workflow and commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-invite-permissions.yml
          git add app.py
          git commit -m "Set minimal Discord permissions for invite link"
          git push
