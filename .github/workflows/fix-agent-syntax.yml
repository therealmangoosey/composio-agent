name: Fix assistant runtime
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: apply runtime fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')

          # Hard fix: approval_view must never require a positional owner_id.
          s=s.replace('def approval_view(discord,cfg,kind,payload,owner_id):', 'def approval_view(discord,cfg,kind,payload,owner_id=None):', 1)
          s=s.replace('            if i.user.id!=owner_id:await i.response.send_message("Not your approval.",ephemeral=True);return False', '            if owner_id is None: owner_id=i.user.id\n            if i.user.id!=owner_id:await i.response.send_message("Not your approval.",ephemeral=True);return False', 1)

          # If a caller omitted the owner, bind it to the user who clicks.
          if 'def approval_view(discord,cfg,kind,payload,owner_id):' in s:
              raise SystemExit('approval_view signature was not patched')

          # Replace the model-only Composio planner with a live-web research planner.
          start=s.find('def composio_plan(cfg,request):')
          end=s.find('def execute_composio(cfg,plan):', start)
          if start<0 or end<=start:
              raise SystemExit('Could not locate composio_plan')

          replacement=r'''def composio_web_search(query,limit=6):
    try:
        from urllib.parse import quote_plus
        from html import unescape
        url="https://html.duckduckgo.com/html/?q="+quote_plus(query)
        r=requests.get(url,headers={"User-Agent":"Mozilla/5.0 (Termux Tab Assistant)"},timeout=12)
        r.raise_for_status()
        results=[]
        for m in re.finditer(r'<a[^>]+class="result__a"[^>]*href="([^"]+)"[^>]*>(.*?)</a>',r.text,re.I|re.S):
            href=unescape(m.group(1)); title=unescape(re.sub(r"<.*?>"," ",m.group(2))).strip()
            if not href.startswith("http") or any(x["url"]==href for x in results): continue
            results.append({"title":short(title,220),"url":href})
            if len(results)>=limit: break
        return results
    except Exception as exc:
        log_error(exc); return []

def composio_research(request):
    queries=[
        f"Composio {request} action tool",
        f"site:composio.dev/docs {request} Composio",
        f"site:composio.dev/tools {request} Composio",
        f"site:github.com/ComposioHQ {request} Composio",
    ]
    seen=set(); results=[]
    for q in queries:
        for item in composio_web_search(q,5):
            if item["url"] in seen: continue
            seen.add(item["url"]); results.append(item)
            if len(results)>=12: return results
    return results

def composio_plan(cfg,request):
    if not cfg["composio"].get("api_key"): raise RuntimeError("Composio API key is not configured.")
    evidence=composio_research(request)
    evidence_text="\n".join(f"- {x['title']} — {x['url']}" for x in evidence)
    s=new_session()
    add(s,"user",f'''You are planning a Composio action.
USER REQUEST:
{request}

LIVE WEB RESEARCH RESULTS:
{evidence_text or "No web results were found."}

Return JSON only:
{{"steps":[{{"tool":"EXACT_COMPOSIO_ACTION_SLUG","description":"what it does","args":{{}}}}]}}

Rules:
- Do not guess an action slug from model memory.
- Use the research evidence to identify the current Composio action.
- If the evidence does not establish a reliable action, return {{"steps":[]}}.
- Never execute anything.''')
    raw=send(cfg,s,system="You are a Composio action researcher. Use live research evidence. Never invent tool names or arguments.",temperature=0.1,json_mode=True)
    match=re.search(r"\{.*\}",raw,re.S)
    if not match: raise RuntimeError("Composio researcher returned invalid JSON.")
    plan=json.loads(match.group(0))
    if not isinstance(plan,dict) or not isinstance(plan.get("steps"),list) or not plan["steps"]:
        raise RuntimeError("I couldn't verify a suitable Composio action from live research, so I won't guess.")
    for step in plan["steps"]:
        if not isinstance(step,dict) or not step.get("tool"):
            raise RuntimeError("Composio researcher returned an incomplete action.")
    return plan

'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile app.py
      - name: Commit patched app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'chore: apply runtime fixes'
          git push